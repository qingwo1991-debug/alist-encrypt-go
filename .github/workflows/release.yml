name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release version (optional, e.g. v1.2.3)
        required: false
        default: ''

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: '1.26.5'
  FLUTTER_VERSION: '3.44.0'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Work around GitHub sometimes resolving the pull_request merge ref
          # to a stale/ghost SHA (observed as abac926 on this repo): test on
          # the PR head directly so the job always sees the real diff.
          ref: ${{ github.event.pull_request.head.sha || '' }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run unit tests
        run: |
          go test ./...
          go test -tags noembedwebui ./...
          # shared/encryptcore 是独立模块：单独跑它的测试套件
          cd shared/encryptcore && go test -mod=readonly ./...

  test-concurrency-performance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            shared/encryptcore/go.sum
      - name: Race-check playback and cache paths
        run: |
          go test -race -mod=readonly -timeout 10m ./internal/dao ./internal/proxy ./internal/handler ./internal/httputil ./internal/playbacktest ./internal/server
          go test -race -mod=readonly -timeout 2m -count=32 -run '^TestProbeFairDispatchBlockedProviderDoesNotOccupyWorkers$' ./internal/handler
          (cd shared/encryptcore && go test -race -mod=readonly -timeout 10m ./...)
      - name: Record deterministic playback fault acceptance
        env:
          PLAYBACK_ACCEPTANCE_REPORT: ${{ github.workspace }}/performance-results/playback-acceptance.json
          PLAYBACK_V3_AMPLIFICATION_REPORT: ${{ github.workspace }}/performance-results/v3-amplification.json
        run: |
          mkdir -p performance-results
          go test -race -mod=readonly -timeout 3m -count=1 -run '^TestPlaybackAcceptance' ./internal/proxy
          go test -race -mod=readonly -timeout 3m -count=1 -run '^TestV3AmplificationAcceptance$' ./internal/proxy
          go test -race -mod=readonly -timeout 1m -count=10 ./internal/playbacktest
      - name: Record network-free performance baselines
        run: |
          set -euo pipefail
          mkdir -p performance-results
          go version > performance-results/environment.txt
          lscpu >> performance-results/environment.txt
          (cd shared/encryptcore && go test -mod=readonly -run '^$' -bench 'Benchmark(V3|Playback)' -benchmem -benchtime=200ms -count=3 ./...) | tee performance-results/encryptcore.txt
          go test -mod=readonly -run '^$' -bench 'Benchmark(Decrypted|Probe)' -benchmem -benchtime=200ms -count=3 ./internal/proxy ./internal/handler | tee performance-results/proxy-handler.txt
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-baselines
          path: performance-results/
          if-no-files-found: ignore

  test-playback-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify rendered-frame measurement semantics
        run: node --test tools/playback-probe/*.test.mjs

  test-mysql-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: metadata_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Verify V3 metadata on real MySQL
        env:
          MYSQL_TEST_DSN: root:integration-only@tcp(127.0.0.1:3306)/metadata_test?parseTime=true
        run: go test -mod=readonly -timeout 5m -run '^TestMySQL(V3Metadata|ListFileMeta)Integration$' -v ./internal/storage/mysqlstore

  test-mobile-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            mobile/openlist-lib/go.sum
            mobile/openlist-lib/src/go.sum

      - name: Verify controlled shared-crypto module overlay
        run: |
          set -euo pipefail
          bash -n mobile/openlist-lib/scripts/apply_module_overlay.sh
          bash -n mobile/openlist-lib/scripts/init_openlist.sh
          python3 mobile/openlist-lib/scripts/test_source_overlay.py
          python3 mobile/openlist-lib/scripts/verify_source_overlay.py --check-mirrors
          # Emit checksum evidence for newly selected transitive modules; the
          # readonly overlay check below still rejects unreviewed checksum drift.
          GOWORK=off go -C mobile/openlist-lib mod download -json golang.org/x/net@v0.53.0 golang.org/x/term@v0.43.0
          bash mobile/openlist-lib/scripts/apply_module_overlay.sh
          bash mobile/openlist-lib/scripts/apply_module_overlay.sh
          for module in mobile/openlist-lib mobile/openlist-lib/src; do
            if ! GOWORK=off go -C "$module" list -mod=readonly -m all; then
              # Diagnose in the disposable runner only; never accept an automatically rewritten graph.
              GOWORK=off go -C "$module" list -mod=mod -m all || true
              git diff -- "$module/go.mod" "$module/go.sum"
              exit 1
            fi
            shared_dir=$(GOWORK=off go -C "$module" list -mod=readonly -m -f '{{.Replace.Dir}}' github.com/alist-encrypt-go/shared/encryptcore)
            case "$shared_dir" in
              /*) resolved_shared=$(realpath "$shared_dir") ;;
              *) resolved_shared=$(realpath "$module/$shared_dir") ;;
            esac
            printf 'Shared module: %s -> %s\n' "$shared_dir" "$resolved_shared"
            test "$resolved_shared" = "$GITHUB_WORKSPACE/shared/encryptcore"
          done
          git diff --exit-code -- mobile/openlist-lib/go.mod mobile/openlist-lib/go.sum mobile/openlist-lib/src/go.mod mobile/openlist-lib/src/go.sum

      - name: Test mobile Go library
        working-directory: mobile/openlist-lib
        run: |
          set -euo pipefail
          go test -mod=readonly \
            ./openlistlib/encrypt \
            ./drivers/139 \
            ./drivers/189 \
            ./drivers/aliyundrive_open \
            ./drivers/dropbox \
            ./drivers/quark_open \
            ./drivers/google_drive \
            ./drivers/onedrive \
            ./drivers/mega \
            ./internal/net \
            ./internal/bootstrap \
            ./internal/conf \
            ./internal/fs \
            ./internal/op \
            ./pkg/singleflight \
            ./pkg/utils \
            ./server/...

      - name: Test fixed pinned MEGA cancellation fork without external credentials
        working-directory: shared/go-mega
        run: |
          go test -race -mod=readonly -timeout 5m -run 'Test(Context|Close|Backoff)' ./...

      - name: Race-check MEGA reader close, retry and driver client ownership
        working-directory: mobile/openlist-lib
        run: |
          go test -race -mod=readonly -timeout 5m -run 'Test(Mega|RetryContext|Driver)' ./drivers/mega ./pkg/utils ./internal/net

      - name: Race-check mobile network and readiness regressions
        working-directory: mobile/openlist-lib
        run: |
          go test -race -mod=readonly -timeout 10m -run 'Test(ConfirmedMetadata|MetadataWarm|MXWebDAV|ProxyLifecycle|DualNetwork|Native|NetworkBridge|RouteTransport|DriverRoute|ProviderCatalog|MetaSync|RangeProbe|NativePhysical|MobileStream|StreamIdle|StorageReady|DoContext|PlaybackTiming|PlaybackFirstByte|PlaybackSession|V3|MobileV3)' ./openlistlib ./openlistlib/encrypt ./internal/op ./pkg/singleflight

      - name: Test synchronized upstream source copy
        working-directory: mobile/openlist-lib/src
        run: |
          set -euo pipefail
          go test -mod=readonly \
            ./drivers/139 \
            ./drivers/189 \
            ./drivers/aliyundrive_open \
            ./drivers/dropbox \
            ./drivers/quark_open \
            ./drivers/google_drive \
            ./drivers/onedrive \
            ./drivers/mega \
            ./internal/net \
            ./internal/bootstrap \
            ./internal/conf \
            ./internal/fs \
            ./internal/op \
            ./pkg/singleflight \
            ./pkg/utils \
            ./server/...

  test-webui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        directory:
          - enc-webui
          - mobile/enc-webui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Test and build Web UI
        working-directory: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run tsc-check
          npx eslint --config ./eslintrc/eslint-config.js --ext .js,.jsx,.vue,.ts,.tsx src
          npx vite build --mode build

  test-flutter:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Node.js for native bridge source contracts
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check native bridge source contracts (not device instrumentation)
        run: node --test mobile/test/native_network_bridge_contract.test.mjs mobile/test/download_async_io_contract.test.mjs

      - name: Analyze and test Flutter app
        working-directory: mobile
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          # Keep errors and warnings fatal; the inherited upstream app still
          # has informational lint debt that should not block validation.
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub

  version:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          export TZ=Asia/Shanghai

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            VERSION="$REF_NAME"
          else
            VERSION="v$(date +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$VERSION" =~ ^[vV]?[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          VERSION_NAME="${VERSION#v}"
          VERSION_NAME="${VERSION_NAME#V}"
          if [[ ! "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "Invalid build version name: $VERSION_NAME" >&2
            exit 1
          fi
          BUILD_NUMBER=$(date +%y%m%d%H)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

  build-docker:
    runs-on: ubuntu-latest
    needs: [test, test-concurrency-performance, test-playback-probe, test-mysql-metadata, test-mobile-go, test-webui, test-flutter]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-binaries:
    runs-on: ubuntu-latest
    needs: [test, test-concurrency-performance, test-playback-probe, test-mysql-metadata, test-mobile-go, test-webui, test-flutter, version]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: alist-encrypt-go-linux-amd64
            tool_name: encrypt-tool-linux-amd64
          - goos: linux
            goarch: arm64
            name: alist-encrypt-go-linux-arm64
            tool_name: encrypt-tool-linux-arm64
          - goos: linux
            goarch: arm
            goarm: '7'
            name: alist-encrypt-go-linux-armv7
            tool_name: encrypt-tool-linux-armv7
          - goos: windows
            goarch: amd64
            name: alist-encrypt-go-windows-amd64.exe
            tool_name: encrypt-tool-windows-amd64.exe
          - goos: windows
            goarch: arm64
            name: alist-encrypt-go-windows-arm64.exe
            tool_name: encrypt-tool-windows-arm64.exe
          - goos: darwin
            goarch: amd64
            name: alist-encrypt-go-darwin-amd64
            tool_name: encrypt-tool-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: alist-encrypt-go-darwin-arm64
            tool_name: encrypt-tool-darwin-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: enc-webui/package-lock.json

      - name: Build embedded Web UI
        working-directory: enc-webui
        run: |
          npm ci
          npm run build

      - name: Install embedded Web UI
        run: |
          rm -rf web/public
          mkdir -p web/public
          cp -a enc-webui/dist/. web/public/

      - name: Build binaries
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -ldflags="-w -s" -o "${{ matrix.name }}" ./cmd/server
          go build -ldflags="-w -s" -o "${{ matrix.tool_name }}" ./cmd/encrypt-tool

      - name: Upload server artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

      - name: Upload encrypt-tool artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.tool_name }}
          path: ${{ matrix.tool_name }}
          if-no-files-found: error

  test-mobile-aar-bind:
    runs-on: ubuntu-latest
    needs: [test-mobile-go]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: mobile/openlist-lib/go.sum
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android binding with shared crypto
        working-directory: mobile/openlist-lib/scripts
        env:
          GOWORK: 'off'
          GOFLAGS: '-mod=readonly'
        run: |
          set -euo pipefail
          bash ./init_gomobile.sh
          bash ./gobind.sh release ${{ matrix.abi }}
          git diff --exit-code -- ../go.mod ../go.sum ../src/go.mod ../src/go.sum

      - name: Upload arm64 binding for PR Kotlin compilation
        if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v6
        with:
          name: pr-mobile-aar-arm64
          path: mobile/android/app/libs/*.aar
          if-no-files-found: error

  # Standalone PR gate: main/release jobs must not depend on this skipped job.
  # Compiles the actual Kotlin/gomobile interface; does not validate device routing.
  test-mobile-native-android:
    runs-on: ubuntu-latest
    needs: [test-mobile-aar-bind, test-flutter]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download reviewed arm64 Android binding
        uses: actions/download-artifact@v7
        with:
          name: pr-mobile-aar-arm64
          path: mobile/android/app/libs

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Compile APK with actual native bridge
        working-directory: mobile
        env:
          ABI_FILTERS: arm64-v8a
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          # Flutter debug injects all ABI ndkFilters, conflicting with the
          # repository's explicit ABI splits. Use the existing release build
          # mode (local/debug signing fallback, no publishing in this PR job).
          flutter build apk --no-pub --release --split-per-abi --target-platform android-arm64

      - name: Upload native bridge compilation APK
        uses: actions/upload-artifact@v6
        with:
          name: pr-native-android-arm64
          path: mobile/build/app/outputs/flutter-apk/*arm64-v8a*.apk
          if-no-files-found: error

  build-mobile-aar:
    runs-on: ubuntu-latest
    needs: [test, test-concurrency-performance, test-playback-probe, test-mysql-metadata, test-mobile-go, test-webui, test-flutter, version]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            gomobile_target: arm64-v8a
          - abi: armeabi-v7a
            gomobile_target: armeabi-v7a
          - abi: x86_64
            gomobile_target: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: mobile/openlist-lib/go.sum

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/enc-webui/package-lock.json

      - name: Build and install reviewed mobile Web UI
        run: |
          set -euo pipefail
          bash mobile/openlist-lib/scripts/install_openlist_web.sh
          npm ci --prefix mobile/enc-webui
          npm run build --prefix mobile/enc-webui
          bash mobile/openlist-lib/scripts/install_enc_web.sh

      - name: Build mobile Go binding from reviewed repository source
        working-directory: mobile/openlist-lib/scripts
        env:
          # 用本项目 release 版本号（version job 输出）覆盖 OpenList 前端显示
          # 的版本文案，左上角不再是上游 v4.2.x，而是本项目版本。
          OPENLIST_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          bash ./init_gomobile.sh
          bash ./gobind.sh release ${{ matrix.gomobile_target }}

      - name: Upload Android library artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mobile-aar-${{ matrix.abi }}
          path: mobile/android/app/libs/*
          if-no-files-found: error

  build-mobile:
    runs-on: ubuntu-latest
    needs: [test, test-concurrency-performance, test-playback-probe, test-mysql-metadata, test-mobile-go, test-webui, test-flutter, version, build-mobile-aar]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target_platform: android-arm64
          - abi: armeabi-v7a
            target_platform: android-arm
          - abi: x86_64
            target_platform: android-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}

      - name: Download Android library artifacts
        uses: actions/download-artifact@v7
        with:
          name: mobile-aar-${{ matrix.abi }}
          path: mobile/android/app/libs

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build APK
        working-directory: mobile
        env:
          ABI_FILTERS: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build apk --no-pub --release --split-per-abi \
            --target-platform=${{ matrix.target_platform }} \
            --build-name=${{ needs.version.outputs.version_name }} \
            --build-number=${{ needs.version.outputs.build_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: mobile-apk-${{ matrix.abi }}
          path: mobile/build/app/outputs/flutter-apk/*${{ matrix.abi }}*.apk
          if-no-files-found: warn

  release-core:
    runs-on: ubuntu-latest
    needs: [version, build-binaries]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: List release artifacts
        run: find release-artifacts -type f | sort

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.version }}
          RELEASE_NAME: Alist-Encrypt-Go ${{ needs.version.outputs.version }}
          TARGET_COMMITISH: ${{ github.sha }}
        run: |
          set -euo pipefail

          mapfile -t release_files < <(find release-artifacts -type f \( -name "*.exe" -o -name "alist-encrypt-go-*" -o -name "encrypt-tool-*" \) | sort)
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "No release files found"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${release_files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${release_files[@]}" \
              --title "$RELEASE_NAME" \
              --target "$TARGET_COMMITISH" \
              --generate-notes=false \
              --notes ""
          fi

  release-mobile:
    runs-on: ubuntu-latest
    needs: [version, build-mobile, release-core]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          pattern: mobile-apk-*
          path: release-mobile
          merge-multiple: true

      - name: Create or update GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.version }}
          RELEASE_NAME: OpenList Encrypt ${{ needs.version.outputs.version }}
          TARGET_COMMITISH: ${{ github.sha }}
        run: |
          set -euo pipefail

          mapfile -t apk_files < <(find release-mobile -type f -name "*.apk" | sort)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No APK files found"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${apk_files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${apk_files[@]}" \
              --title "$RELEASE_NAME" \
              --target "$TARGET_COMMITISH" \
              --generate-notes=false \
              --notes ""
          fi
